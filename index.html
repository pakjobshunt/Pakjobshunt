let currentPage = 1;
const jobsPerPage = 6;
let currentJobsList = [...jobs];

function renderJobs(list = currentJobsList) {
  const box = document.getElementById("jobs");
  box.innerHTML = "";

  document.getElementById("totalJobs").innerText = list.length;
  document.getElementById("govJobs").innerText = list.filter(j => j.category === "Government").length;
  document.getElementById("privateJobs").innerText = list.filter(j => j.category === "Private").length;
  document.getElementById("itJobs").innerText = list.filter(j => j.category === "IT").length;

  list.sort((a, b) => new Date(b.published) - new Date(a.published));

  const startIndex = (currentPage - 1) * jobsPerPage;
  const endIndex = startIndex + jobsPerPage;
  const paginatedJobs = list.slice(startIndex, endIndex);

  paginatedJobs.forEach(j => {
    box.innerHTML += `
    <div class="job">
    <span class="badge">${j.category}</span>
    <h3>${j.title}</h3>
    <p><b>Company:</b> ${j.company}</p>
    <p><b>City:</b> ${j.city}</p>
    <p><b>Qualification:</b> ${j.qualification}</p>
    <p><b>Vacancies:</b> ${j.vacancies}</p>
    <p><b>Deadline:</b> ${j.end}</p>
    <div class="btns">
<button class="details" onclick="showDetails(${j.id})">Details</button>
<a class="apply" href="${j.apply}" target="_blank">Apply Now</a>
</div>
    </div>`;
  });

  renderPaginationControls(list.length);
}

function renderPaginationControls(totalItems) {
  const paginationBox = document.getElementById("pagination");
  paginationBox.innerHTML = "";

  const totalPages = Math.ceil(totalItems / jobsPerPage);
  if (totalPages <= 1) return;

  const prevBtn = document.createElement("button");
  prevBtn.innerText = "« Previous";
  prevBtn.disabled = currentPage === 1;
  prevBtn.onclick = () => {
    if (currentPage > 1) {
      currentPage--;
      renderJobs();
      window.scrollTo({ top: 300, behavior: 'smooth' });
    }
  };
  paginationBox.appendChild(prevBtn);

  for (let i = 1; i <= totalPages; i++) {
    const pageBtn = document.createElement("button");
    pageBtn.innerText = i;
    if (i === currentPage) pageBtn.classList.add("active");
    pageBtn.onclick = () => {
      currentPage = i;
      renderJobs();
      window.scrollTo({ top: 300, behavior: 'smooth' });
    };
    paginationBox.appendChild(pageBtn);
  }

  const nextBtn = document.createElement("button");
  nextBtn.innerText = "Next »";
  nextBtn.disabled = currentPage === totalPages;
  nextBtn.onclick = () => {
    if (currentPage < totalPages) {
      currentPage++;
      renderJobs();
      window.scrollTo({ top: 300, behavior: 'smooth' });
    }
  };
  paginationBox.appendChild(nextBtn);
}

  const q = document.getElementById("search").value.toLowerCase();
  const c = document.getElementById("category").value;

  currentJobsList = jobs.filter(j =>
    (c === "All" || j.category === c) &&
    (j.title.toLowerCase().includes(q) ||
    j.company.toLowerCase().includes(q) ||
    j.city.toLowerCase().includes(q))
  );

  currentPage = 1;
  renderJobs();
}
